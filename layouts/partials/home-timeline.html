<section id="timeline" class="theme-timeline"><details><summary>The project timeline</summary>{{ range .Site.Data.timeline }}<article class="record-row"><time class="mono" datetime="{{ .date }}">{{ .label | default (time.Format "Jan 2, 2006" .date) }}</time><div><h3>{{ .title }}</h3><p>{{ .body }}</p>{{ with .source }}<a href="{{ . }}"{{ if strings.HasPrefix . "http" }} target="_blank" rel="noopener"{{ end }}>Read the source</a>{{ end }}</div></article>{{ end }}</details></section>
