<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:#0f1311;color:#ece6d8;font-family:'Barlow',sans-serif;display:flex;justify-content:space-between;align-items:center;padding:26px 56px;border-bottom:1px solid rgba(236,230,216,.18)">
<a href="#" style="font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:26px;letter-spacing:.04em;text-transform:uppercase">Waco DC <span style="color:#e89a2c">Community Action</span></a>
<div style="display:flex;gap:30px;font-size:15px;font-weight:500;align-items:center;letter-spacing:.02em">
<a href="#">The Site</a>
<sc-if value="{{ aRecord }}" hint-placeholder-val="{{ false }}"><a href="#" style="color:#e89a2c;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:8px">Updates</a></sc-if>
<sc-if value="{{ nRecord }}" hint-placeholder-val="{{ true }}"><a href="#">Updates</a></sc-if>
<sc-if value="{{ aPress }}" hint-placeholder-val="{{ false }}"><a href="#" style="color:#e89a2c;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:8px">Press</a></sc-if>
<sc-if value="{{ nPress }}" hint-placeholder-val="{{ true }}"><a href="#">Press</a></sc-if>
<sc-if value="{{ aMeetings }}" hint-placeholder-val="{{ false }}"><a href="#" style="color:#e89a2c;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:8px">Meetings</a></sc-if>
<sc-if value="{{ nMeetings }}" hint-placeholder-val="{{ true }}"><a href="#">Meetings</a></sc-if>
<sc-if value="{{ aDocuments }}" hint-placeholder-val="{{ false }}"><a href="#" style="color:#e89a2c;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:8px">Resources</a></sc-if>
<sc-if value="{{ nDocuments }}" hint-placeholder-val="{{ true }}"><a href="#">Resources</a></sc-if>
<a href="#" style="background:#e89a2c;color:#111;padding:11px 18px;border-radius:3px;font-weight:600">Sign the petition</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:96},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;record&quot;,&quot;press&quot;,&quot;meetings&quot;,&quot;documents&quot;],&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'none';
    const o = {};
    ['Record','Press','Meetings','Documents'].forEach(k => { const on = a === k.toLowerCase(); o['a'+k] = on; o['n'+k] = !on; });
    return o;
  }
}
</script>
</body>
</html>
