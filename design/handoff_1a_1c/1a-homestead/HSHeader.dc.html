<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:#f6f2ea;color:#1f2a1f;font-family:'Public Sans',sans-serif">
<div style="background:#24452f;color:#f6f2ea;font-size:14px;display:flex;justify-content:center;gap:16px;padding:10px 24px;align-items:center">
<span style="font-weight:600">Yard signs are back in stock.</span><span style="opacity:.85">$5 each, every dollar goes to legal and advocacy.</span><a href="#" style="text-decoration:underline;font-weight:600">Order a sign</a>
</div>
<div style="display:flex;align-items:center;justify-content:space-between;padding:22px 56px;border-bottom:1px solid #d8d0bf">
<a href="#" style="display:flex;align-items:center;gap:14px">
<div style="width:40px;height:40px;border-radius:50%;background:#24452f;position:relative;overflow:hidden"><div style="position:absolute;left:0;right:0;top:24px;bottom:0;background:#b8552e"></div><div style="position:absolute;left:14px;top:11px;width:12px;height:12px;border-radius:50%;background:#f6f2ea"></div></div>
<div style="display:flex;flex-direction:column;gap:1px"><div style="font-family:'Newsreader',serif;font-size:23px;font-weight:600;letter-spacing:-.01em;line-height:1">Waco Data Center</div><div style="font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#5d6b5a">Community Action</div></div>
</a>
<div style="display:flex;gap:32px;font-size:15px;font-weight:500;align-items:center">
<a href="#">The Project</a>
<sc-if value="{{ aRecord }}" hint-placeholder-val="{{ false }}"><a href="#" style="color:#b8552e;font-weight:600;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px">Updates</a></sc-if>
<sc-if value="{{ nRecord }}" hint-placeholder-val="{{ true }}"><a href="#">Updates</a></sc-if>
<sc-if value="{{ aPress }}" hint-placeholder-val="{{ false }}"><a href="#" style="color:#b8552e;font-weight:600;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px">Press</a></sc-if>
<sc-if value="{{ nPress }}" hint-placeholder-val="{{ true }}"><a href="#">Press</a></sc-if>
<sc-if value="{{ aMeetings }}" hint-placeholder-val="{{ false }}"><a href="#" style="color:#b8552e;font-weight:600;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px">Meetings</a></sc-if>
<sc-if value="{{ nMeetings }}" hint-placeholder-val="{{ true }}"><a href="#">Meetings</a></sc-if>
<sc-if value="{{ aDocuments }}" hint-placeholder-val="{{ false }}"><a href="#" style="color:#b8552e;font-weight:600;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px">Resources</a></sc-if>
<sc-if value="{{ nDocuments }}" hint-placeholder-val="{{ true }}"><a href="#">Resources</a></sc-if>
<a href="#" style="background:#b8552e;color:#fff;padding:11px 20px;border-radius:999px;font-weight:600">Sign the petition</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:130},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;record&quot;,&quot;press&quot;,&quot;meetings&quot;,&quot;documents&quot;],&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'none';
    const o = {};
    ['Record','Press','Meetings','Documents'].forEach(k => { const on = a === k.toLowerCase(); o['a'+k] = on; o['n'+k] = !on; });
    return o;
  }
}
</script>
</body>
</html>
